  <template id="prompt-template">I want you to act as a **professional Indian equity analyst + macroeconomist + risk manager**.

I am considering taking a swing position in:

**Company: [COMPANY NAME]**
**Ticker: [TICKER]**
**Current stock price: ₹[PRICE]**
**Weekly 50 EMA: ₹[EMA VALUE]**
**Date: [DATE]**

The stock has just **touched the weekly 50 EMA**, which is my technical trigger to investigate a potential position.

My trading strategy is fixed:

* Initial capital allocated to this trade = **₹X**
* At the first weekly 50 EMA touch → invest **X/3**
* If the stock falls another **10% from the initial entry price** → invest another **X/3**
* If it falls another **10%** → invest the final **X/3**
* After all 3 entries, I will not add further capital.
* If the stock eventually falls **40% from my initial entry price**, I will exit/book the loss.
* I am looking for a **swing/medium-term position**, not a permanent buy-and-hold investment.
* I do NOT want you to tell me to blindly average down.

## MOST IMPORTANT REQUIREMENT

At the very beginning of your conclusion, give me ONLY one of these:

# YES — START BUILDING THE POSITION

or

# NO — DO NOT START THE POSITION

Do not give me "maybe", "it depends", "cautiously yes", "neutral", or any diplomatic answer.

I want your **best probability-weighted decision based on the evidence available today**.

After giving YES/NO, explain the reasoning in detail.

---

# PART 1 — UNDERSTAND THE BUSINESS FIRST

Explain the company's business from first principles, assuming I have no finance background.

Cover:

1. What exactly does the company sell/do?
2. How does it make money?
3. Who are its customers?
4. What are its major business segments?
5. Which segment contributes most to revenue/profit?
6. What are its major cost components?
7. What determines its profit margins?
8. What determines demand for its products/services?
9. Is the business cyclical, defensive, secular-growth, or a mixture?
10. What are the company's major competitive advantages?
11. Who are its major competitors?
12. What could structurally damage this business?

Give me a simple causal chain such as:

Economic condition
↓
Customer behaviour
↓
Company demand
↓
Revenue
↓
Margins
↓
Profit
↓
Cash flow
↓
Stock price

---

# PART 2 — CURRENT MACROECONOMIC ENVIRONMENT

Research the **current economic environment as of today**, using the latest available information.

Do not simply tell me whether India's GDP is growing.

Analyze the variables that actually matter for THIS COMPANY.

At minimum investigate:

### India

* GDP growth
* GDP composition
* Industrial production / IIP
* Inflation / CPI
* RBI repo rate
* Bank lending rates / credit conditions
* 10-year government bond yield
* Bank credit growth
* Government fiscal spending
* Government CAPEX
* Private-sector CAPEX
* Corporate profitability
* Capacity utilisation
* Consumer demand
* Rural demand, where relevant
* Urban demand, where relevant
* Employment/income trends, where relevant
* Commodity prices, where relevant
* INR/USD, where relevant

### Global

Investigate relevant:

* US economic cycle
* US interest rates/Fed policy
* China economic cycle
* Global growth
* Commodity cycle
* Oil prices
* Metals prices
* Global trade
* Geopolitical developments
* Currency movements

Do NOT discuss variables that have no meaningful connection with this company's earnings.

For every important macro factor, explain:

**Current condition → impact on company → positive/negative → magnitude → whether temporary or structural**

---

# PART 3 — COMPANY-SPECIFIC ECONOMIC CYCLE

This is extremely important.

Determine:

**What economic conditions historically help this company perform well?**

For example:

* Falling interest rates
* Rising interest rates
* High GDP growth
* Weak GDP growth
* High government CAPEX
* High private CAPEX
* Strong consumer spending
* Weak consumer spending
* High commodity prices
* Low commodity prices
* Strong INR
* Weak INR
* High inflation
* Low inflation
* High credit growth
* Tight liquidity
* Strong housing cycle
* Strong automobile cycle
* Strong IT spending
* Strong infrastructure spending

Create a table:

| Economic factor | Current condition | Effect on company | Positive/Negative | Trend |
| --------------- | ----------------- | ----------------- | ----------------- | ----- |

Then identify the **3–5 most important economic variables** for this particular company.

---

# PART 4 — COMPANY FUNDAMENTALS

Analyze the latest available financial information.

Look at at least:

* Revenue growth
* EBITDA growth
* EBITDA margin
* EBIT margin where relevant
* PAT growth
* EPS growth
* Operating cash flow
* Free cash flow
* ROE
* ROCE
* Debt
* Debt/equity
* Interest coverage
* Working capital
* Receivables
* Inventory
* Capex
* Order book, if relevant
* Book-to-bill, if relevant
* Asset quality, if financial company
* NIM, if bank
* Credit growth, if bank
* GNPA/NNPA, if bank
* Provisioning, if bank
* AUM, if NBFC
* Claims/embedded value, if insurer
* Any other industry-specific metric that materially affects the business

Don't just give numbers.

Explain:

**What changed → why it changed → whether it is temporary or structural → what it means for the next 4–12 quarters.**

---

# PART 5 — EARNINGS QUALITY

I want you to investigate whether reported earnings are actually high quality.

Look for:

* One-time gains
* Exceptional items
* Accounting changes
* Aggressive revenue recognition
* Rising receivables
* Inventory buildup
* Weak operating cash flow despite rising profit
* Debt-funded growth
* Subsidiary issues
* Related-party transactions
* Promoter pledging
* Auditor qualifications
* Governance concerns
* Large contingent liabilities
* Regulatory problems

Answer:

**Are the reported profits genuinely sustainable? YES/NO**

Explain why.

---

# PART 6 — MANAGEMENT & CAPITAL ALLOCATION

Analyze:

* Management quality
* Promoter ownership
* Promoter buying/selling
* Institutional ownership trend
* Dividend policy
* Buybacks
* Acquisitions
* Debt management
* Capital allocation history
* Major strategic decisions
* Governance concerns

Most importantly:

**Is management currently creating value or destroying value?**

---

# PART 7 — VALUATION

I am NOT asking you to simply say:

"PE is high, therefore expensive."

Analyze valuation properly.

Look at:

* P/E
* Forward P/E
* EV/EBITDA
* Price/book where relevant
* PEG where meaningful
* Free cash flow yield
* Dividend yield
* Historical valuation range
* Peer valuation
* Growth expectations embedded in the price

Determine:

1. Is the stock cheap?
2. Is it fairly valued?
3. Is it expensive?
4. Is the valuation justified by expected growth?

Most importantly:

**Could the stock fall further even if the business remains fundamentally healthy simply because valuation is contracting?**

---

# PART 8 — WHY IS THE STOCK FALLING?

This is one of the most important sections.

Investigate the reason for the current decline.

Classify the decline into one or more:

### A. Healthy correction

Business remains strong but valuation/sentiment is cooling.

### B. Cyclical slowdown

Business is entering a normal economic downturn.

### C. Earnings deterioration

Actual earnings/cash flow are weakening.

### D. Structural deterioration

The company's long-term competitive position is worsening.

### E. Temporary event

A short-term issue that may reverse.

### F. Market-wide correction

Stock is falling mainly because the broader market is falling.

### G. Sector-wide correction

Industry is facing temporary pressure.

### H. Company-specific problem

Something uniquely negative is happening to this company.

Tell me which category/categories apply and assign approximate probabilities.

---

# PART 9 — TECHNICAL CONTEXT

I am deliberately NOT asking you to generate a complicated technical analysis.

My technical trigger is already:

**Weekly candle touches 50 EMA.**

But check whether there are obvious technical warning signs that make this a particularly dangerous entry.

Look at:

* Long-term trend
* Weekly structure
* Major support levels
* Previous 50 EMA reactions
* 200 DMA / major long-term averages
* Volume
* Relative strength vs Nifty
* Relative strength vs sector
* Major breakdowns
* Gap-downs
* Distribution
* Major resistance above the current price

I do NOT want technical analysis to override strong fundamental evidence.

Use technical analysis primarily to identify whether this is:

**a normal pullback inside an uptrend**

or

**the beginning of a major downtrend.**

---

# PART 10 — HISTORICAL ANALOGUES

Research previous periods when this company experienced similar conditions.

Find at least 2–3 historical examples where:

* The stock approached/touched a major long-term moving average, AND/OR
* Earnings/economic conditions deteriorated, AND/OR
* The sector entered a similar cycle.

For each example explain:

**What happened → why it happened → how far the stock fell → what eventually caused recovery.**

I want to understand whether buying near the weekly 50 EMA has historically been a reasonable strategy for this company.

---

# PART 11 — MY SPECIFIC AVERAGING STRATEGY

Now evaluate my exact strategy mathematically.

Initial entry = P

Entry 1 = P → X/3

Entry 2 = 0.90P → X/3

Entry 3 = 0.80P → X/3

Hard exit = 0.60P

Calculate:

* Weighted average purchase price
* Maximum capital deployed
* Loss percentage at the 40% stop
* Loss percentage after each entry
* Required recovery percentage after the stop
* Risk/reward implications

Then answer:

**Does this averaging structure make sense for THIS COMPANY?**

More importantly, identify whether there is a realistic scenario in which:

**the company looks fundamentally good at the first EMA50 touch but then enters a structural decline and my averaging strategy causes a much larger loss.**

---

# PART 12 — BEAR CASE

Construct the strongest realistic bear case.

Assume I am WRONG and the trade becomes a disaster.

Explain:

1. What could go wrong?
2. What economic conditions could cause it?
3. What company-specific events could cause it?
4. Which financial metrics would deteriorate first?
5. What warning signs should I monitor?
6. What would invalidate the original thesis?

Give me **5–10 early warning indicators**.

---

# PART 13 — BULL CASE

Construct the strongest realistic bull case.

Explain:

1. What could cause the stock to recover?
2. Which economic variables would improve?
3. Which company metrics would improve first?
4. What catalysts could trigger re-rating?
5. What could cause the stock to outperform the Nifty?

---

# PART 14 — 3-SCENARIO MODEL

Create:

### Bear case

Probability:
Expected business condition:
Expected earnings direction:
Expected stock behaviour:
What would invalidate the bear case:

### Base case

Probability:
Expected business condition:
Expected earnings direction:
Expected stock behaviour:
What would invalidate the base case:

### Bull case

Probability:
Expected business condition:
Expected earnings direction:
Expected stock behaviour:
What would invalidate the bull case:

The probabilities must add up to 100%.

Do not make the probabilities artificially balanced.

---

# PART 15 — FINAL DECISION SCORECARD

Score the company from 0–10 on:

| Factor                       | Score |
| ---------------------------- | ----: |
| Business quality             |   /10 |
| Current economic environment |   /10 |
| Industry cycle               |   /10 |
| Earnings momentum            |   /10 |
| Cash-flow quality            |   /10 |
| Balance sheet                |   /10 |
| Management                   |   /10 |
| Valuation                    |   /10 |
| Current stock decline        |   /10 |
| Risk/reward                  |   /10 |
| Probability of recovery      |   /10 |

Then calculate an overall assessment.

But remember:

**The score is NOT allowed to mechanically determine the final answer.**

Your final decision should come from your actual analysis.

---

# PART 16 — CRITICAL DISTINCTION

Before giving the final decision, explicitly answer:

### Is this a falling stock that is temporarily out of favour?

OR

### Is this a fundamentally deteriorating business whose stock is correctly falling?

This distinction is the core of my strategy.

I am willing to tolerate volatility.

I am NOT willing to keep averaging into a structurally deteriorating business.

---

# PART 17 — FINAL VERDICT

Start with exactly one:

# YES — START BUILDING THE POSITION

OR

# NO — DO NOT START THE POSITION

Then give me:

### Why?

Maximum 5 most important reasons.

### What would make you change your YES → NO decision?

Give me specific measurable warning signs.

### What would make you more confident in the YES?

Give me specific measurable positive developments.

### What should I monitor after entering?

Give me the **5 most important indicators**, ranked by importance.

---

# VERY IMPORTANT RESEARCH RULES

1. Use the **latest available data** as of today.
2. Search the internet extensively.
3. Prefer primary sources:

   * RBI
   * SEBI
   * NSE
   * BSE
   * Government of India
   * MoSPI
   * Ministry/Regulator websites
   * Company annual reports
   * Company investor presentations
   * Company earnings calls
4. Use high-quality financial/news sources for supplementary information.
5. Clearly distinguish **facts from your interpretation**.
6. Do not blindly trust management commentary.
7. Cross-check important numbers.
8. Do not use stale information when newer information is available.
9. Mention the date of important data points.
10. If information is unavailable, explicitly say so rather than guessing.
11. Do not give me generic statements such as "the market is uncertain."
12. Quantify things wherever reasonably possible.
13. Focus on the next **4–12 quarters**, because this is a swing/medium-term strategy.
14. Remember that the stock market is forward-looking. Do not wait for reported earnings to deteriorate if leading indicators are already warning of deterioration.
15. Do not recommend buying simply because the stock has fallen.
16. Do not recommend avoiding it simply because the stock has risen.
17. The fact that the stock touched the weekly 50 EMA is ONLY the trigger for this analysis — it is NOT evidence that the stock should be bought.
18. Treat my 40% hard exit as a risk-management rule, not as evidence that the position is safe.
19. If the evidence strongly suggests that the business cycle is deteriorating, say NO even if the valuation looks attractive.
20. If the evidence strongly suggests that this is a temporary correction in a healthy business, say YES even if short-term sentiment is negative.

## FINAL PRINCIPLE

I am trying to answer one question:

**"At this particular weekly 50 EMA touch, is the probability-weighted expected outcome good enough to justify starting my X/3 position?"**

Give me the answer **YES or NO**.

Do not protect me from making a decision.

I want your **best analytical judgment**, not diplomacy.

* GVA growth
* GDP composition

Analyze:

* Food inflation
* Fuel inflation
* WPI where relevant
* Inflation expectations
* Commodity inflation

Explain:

**Is inflation currently helping or hurting Indian equities?**

Also explain whether inflation creates a risk of:

**higher-for-longer interest rates**

or whether it gives RBI room to ease monetary policy.

---

# PART 5 — RBI & INTEREST-RATE CYCLE

Analyze:

* RBI repo rate
* RBI stance
* Liquidity conditions
* CRR/other relevant policy changes
* Bank lending rates
* Deposit rates
* Credit growth
* Financial-system liquidity

Determine where India is in the monetary cycle:

### Neutral

Then explain:

**What does this mean for THIS INDEX?**

For example:

* IT → global growth, USD/INR, US rates, technology spending

# PART 6 — GOVERNMENT CAPEX & FISCAL POLICY

Analyze:

* Government CAPEX

* Actual government expenditure
* Infrastructure spending

Determine whether fiscal policy is:

for this index.

economic activity

sector demand

  <script>
    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    tabs.forEach((tab) => tab.addEventListener('click', () => {
      tabs.forEach((button) => button.setAttribute('aria-selected', button === tab));
      panels.forEach((panel) => { panel.hidden = panel.id !== tab.getAttribute('aria-controls'); });
    }));

    function completePrompt(templateId, replacements) {
      return replacements.reduce((prompt, [placeholder, value]) => prompt.split(placeholder).join(value), document.querySelector(templateId).content.textContent);
    }

    function setUpPromptForm({ formId, templateId, outputId, copyButtonId, statusId, replacements }) {
      const form = document.querySelector(formId);
      const output = document.querySelector(outputId);
      const copyButton = document.querySelector(copyButtonId);
      const status = document.querySelector(statusId);
      let isGenerated = false;

      form.addEventListener('input', () => {
        if (!isGenerated) return;
        isGenerated = false;
        output.value = '';
        copyButton.disabled = true;
        status.textContent = 'Details changed — generate the prompt again before copying.';
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const values = new FormData(form);
        output.value = completePrompt(templateId, replacements(values));
        isGenerated = true;
        copyButton.disabled = false;
        status.textContent = 'Prompt generated — ready to copy.';
        output.focus();
        output.setSelectionRange(0, 0);
      });

      copyButton.addEventListener('click', async () => {
        if (!isGenerated || !output.value.trim()) {
          copyButton.disabled = true;
          status.textContent = 'Generate the prompt before copying.';
          return;
        }
        try {
          await navigator.clipboard.writeText(output.value);
          status.textContent = 'Copied to your clipboard.';
        } catch {
          output.focus();
          output.select();
          document.execCommand('copy');
          status.textContent = 'Prompt selected and copied.';
        }
      });
    }

    setUpPromptForm({
      formId: '#equity-form', templateId: '#prompt-template', outputId: '#equity-output', copyButtonId: '#equity-copy-button', statusId: '#equity-status',
      replacements: (values) => [
        ['[COMPANY NAME]', values.get('company').trim()], ['[TICKER]', values.get('ticker').trim()], ['[PRICE]', values.get('price').trim()],
        ['[EMA VALUE]', values.get('ema').trim()], ['[DATE]', values.get('date').trim()]
      ]
    });

    setUpPromptForm({
